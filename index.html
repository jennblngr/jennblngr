<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <title>Jenny-Lee Boulanger — Développeuse front-end</title>
    <script>
      try {
        var storedTheme = localStorage.getItem('theme-mode')
        var isDark =
          storedTheme === 'dark' ||
          (storedTheme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
