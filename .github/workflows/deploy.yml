name: Deploy

# Déclenché par :
#   - tout push sur main (dont ceux du pipeline GitLab "portfolio-activity-sync", qui pousse
#     data/gitlab-activity.json et les stats d'expérience) ;
#   - un cron quotidien, pour que l'activité GitHub se mette à jour même sans push ;
#   - un lancement manuel.
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 4 * * *' # 05:00/06:00 heure de Paris
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

permissions:
  contents: write # commit des données GitHub synchronisées

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Sync GitHub activity
        run: node scripts/sync-activity.mjs
        env:
          GITHUB_USERNAME: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.CONTRIBUTIONS_READ_TOKEN }}

      # Nombre de dépôts par techno (section Skills). Le jeton doit pouvoir lire le contenu des
      # dépôts (privés compris) pour que les chiffres soient complets.
      - name: Sync GitHub skills
        run: node scripts/sync-skills.mjs
        env:
          GITHUB_USERNAME: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.CONTRIBUTIONS_READ_TOKEN }}

      # Le push utilise le GITHUB_TOKEN de l'Action : il ne redéclenche pas ce workflow.
      - name: Commit synced data
        run: |
          if git diff --quiet -- data/github-activity.json public/activity.json public/skills.json; then
            echo "Aucune nouvelle donnée GitHub"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/github-activity.json public/activity.json public/skills.json
          git commit -m "chore(data): sync GitHub activity"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_EMAILJS_SERVICE_ID: ${{ secrets.VITE_EMAILJS_SERVICE_ID }}
          VITE_EMAILJS_TEMPLATE_ID: ${{ secrets.VITE_EMAILJS_TEMPLATE_ID }}
          VITE_EMAILJS_PUBLIC_KEY: ${{ secrets.VITE_EMAILJS_PUBLIC_KEY }}

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Add VPS to known_hosts
        run: ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy over rsync
        run: |
          rsync -avz --delete \
            dist/ ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ secrets.VPS_DEPLOY_PATH }}
